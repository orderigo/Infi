services:
  - type: web
    name: helios-voice-agent
    env: node
    region: oregon
    plan: starter
    rootDir: examples/helios
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: REACTOR_API_KEY
        sync: false
